<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>图像港</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <header><strong>图像港</strong><span>图片转换 · 批量裁剪</span></header>
  <button id="open-page" class="primary">打开工具网页 ↗</button>
  <button id="open-panel">打开当前网页悬浮窗</button>
  <label class="setting" for="launcher-enabled"><span>显示网页悬浮球<small>对所有网页生效，关闭后仍可使用工具网页</small></span><input id="launcher-enabled" type="checkbox" role="switch" disabled></label>
  <p id="status" role="status" aria-live="polite"></p>
  <footer>点击 Chrome 拼图图标，将「图像港」固定到工具栏，随时打开。</footer>
  <script src="popup.js"></script>
</body></html>
